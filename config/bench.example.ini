# spec-echem bench defaults -- a STARTING POINT for this machine's config/bench.ini.
#
# This file is tracked and is never read by the app. config/bench.ini is the one
# that is read, and it is gitignored, so deleting the clone deletes it:
#   * before re-cloning, copy config/bench.ini somewhere safe and copy it back;
#   * on a new machine, copy this file to config/bench.ini and edit it;
#   * or rebuild it from any earlier run: every {run}_metadata.json holds the full
#     settings, and spec_echem.bench.save_bench_defaults(meta["settings"]) writes
#     them back (then check data_root: it may point into that run's folder).
# After that, "Instrument -> Save as defaults" keeps it up to date.
# A [detector.<serial>] section is added by the app itself; it measures the floor.

[bench]
# This machine's data folder. Uncomment and edit; with no value the app uses
# ~/specechem_data.
# data_root = C:/Users/<you>/Documents/specechem_data
# external | python (Gamry, 32-bit env) | autolab (64-bit env)
# potentiostat_mode = autolab
trigger = True
save_dta = True

# Metrohm Autolab only -- delete this section on a Gamry rig.
# The paths are the Autolab SDK 2.1 installer's defaults; check them against the
# install on this machine (the folder name carries the SDK version).
[autolab]
autolab_sdk = C:\Program Files\Metrohm Autolab\Autolab SDK 2.1\EcoChemie.Autolab.Sdk
autolab_adx = C:\Program Files\Metrohm Autolab\Autolab SDK 2.1\Hardware Setup Files\Adk.x
autolab_hdw = C:\Program Files\Metrohm Autolab\Autolab SDK 2.1\Hardware Setup Files\PGSTAT302N\HardwareSetup.FRA32M.xml
autolab_nox_cv = C:\Program Files\Metrohm Autolab\Autolab SDK 2.1\Standard Nova Procedures\Cyclic voltammetry.nox
autolab_nox_ca = C:\Program Files\Metrohm Autolab\Autolab SDK 2.1\Standard Nova Procedures\Chrono amperometry.nox
# The trigger: P1.A, pin 1. Find the wired pin with examples/probe_dio_pin.py if
# the cable differs; the code default (0xFF) drives all eight pins.
autolab_dio_port = 0
autolab_dio_mask = 1
# Chrono holds from Python (Ei) and no 5 s template wait: both are now the code
# defaults, written here so the file says what the rig runs.
autolab_ca_mode = ei
autolab_wait_s = 0.0
# Blank = the trigger delay is derived (template wait + measured setup lag).
autolab_pulse_delay_s =
# A fixed range for Ei holds and the PITT. NAMES RUN BACKWARDS: CR10_1mA = 1 mA,
# CR09_10mA = 10 mA, CR11_100uA = 100 uA. Blank leaves whatever range the
# instrument was left on (a CV auto-ranges, so that can be a low one).
autolab_current_range = CR10_1mA
