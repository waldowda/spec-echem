# spec-echem — LAB-WIDE defaults.  ***TRACKED IN GIT.***
#
# ---------------------------------------------------------------------------------
#  WHICH FILE SHOULD I EDIT?
#
#  Changing settings for YOUR rig (your lamp, your ND filter, your machine)?
#      -> NOT this file.  Set the values in the GUI and click
#         Instrument tab -> "Save as defaults".  That writes config/bench.ini,
#         which is gitignored and overrides everything here.
#         config/bench.ini is also plain text — hand-edit it freely (app closed).
#
#  Changing the standard for the WHOLE GROUP, for everyone, forever?
#      -> Yes, edit this file, and commit it.
#
#  Editing THIS file to tweak your own rig will work today and then collide with
#  the next `git pull`. That is the mistake this split exists to prevent.
# ---------------------------------------------------------------------------------
#
# Precedence, lowest to highest:
#   1. code defaults (spec_echem/settings.py)
#   2. THIS FILE            — lab-wide, tracked
#   3. config/bench.ini     — this machine, untracked ("Save as defaults")
#   4. an experiment settings JSON, if you explicitly load one
#
# MACHINE-SPECIFIC VALUES DO NOT BELONG HERE (see the note at the bottom).

[spectrometer]
# Usable wavelength range for the halogen + neutral-density source. Leave BLANK for the
# spectrometer's full range (no crop). The lamp fades into noise outside roughly this.
wavelength_min = 400
wavelength_max = 1050

# Working integration time, in ms. Set this from the Linearity Check: it lands ~85% of
# ADC full scale on the reference. It is lamp-dependent — re-run the check if you change
# the source or the ND filter.
integration_time_ms = 0.088
scan_averages = 200

[linearity]
# Integration-time ramp for the Linearity Check, in ms. Saturation depends strongly on
# the light source (halogen + ND saturates near 0.11 ms; an AvaLight will differ), so
# "Find saturation" re-derives Stop for you after a source swap.
lin_start_ms = 0.022
lin_stop_ms = 0.15
lin_steps = 20

# Call the limit of linearity where the response falls this far below the fitted line.
lin_tolerance_pct = 2.0

# Keep the working peak at or below this fraction of ADC full scale. On real detectors
# the response stays linear almost to the clip, so THIS — not the tolerance above — is
# usually what sets the integration time, and it is what leaves headroom for lamp drift.
lin_max_fill_pct = 85.0

[bench]
# Wait for the Gamry's DIGOUT0 edge before collecting spectra. This is the hardware sync
# that makes the optical and electrochemical data share a time zero — leave it on.
trigger = true

# Python (EchemToolkitPy) mode only: also write native Gamry .DTA files to a dta/
# subfolder, alongside the clean analysis .txt. No-op in External mode.
save_dta = true

# DELIBERATELY NOT SET HERE — these two are machine-specific, so each rig writes them to
# its own config/bench.ini via "Save as defaults":
#
#   data_root         a Windows path on the instrument box, something else on a dev Mac.
#   potentiostat_mode "python" needs 32-bit EchemToolkitPy; a 64-bit env can only do
#                     "external". Asserting either one here would be false on half the
#                     machines, and committing a machine path makes every pull a conflict.
